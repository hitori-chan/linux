%YAML 1.2
---
$id: http://devicetree.org/schemas/media/apple,ave.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple video encoder (AVE)

maintainers:
  - hitori-chan <hitori1403@gmail.com>

description:
  The H.264/HEVC video encoder of Apple silicon SoCs. A coprocessor in the
  block runs a firmware that iBoot preloads; the bootloader reserves its
  segments at their DART addresses and adds them, and a copy of the
  firmware's data segment, as memory regions. The host talks to the
  firmware through a mailbox of scratch registers and a doorbell. The
  coprocessor and the encoder sit behind their own DARTs.

properties:
  compatible:
    enum:
      - apple,t6031-ave

  reg:
    items:
      - description: encoder core
      - description: coprocessor
      - description: mailbox
      - description: AXI to fabric bridge

  reg-names:
    items:
      - const: core
      - const: iop
      - const: mbox
      - const: axi2af

  interrupts:
    maxItems: 5

  iommus:
    maxItems: 2

  power-domains:
    maxItems: 6

  power-domain-names:
    items:
      - const: sys
      - const: dma
      - const: pipe4
      - const: pipe5
      - const: me0
      - const: me1

  memory-region:
    description:
      The firmware's text and data segments (with their DART addresses in
      iommu-addresses) and a copy of the data segment, filled in by the
      bootloader.
    maxItems: 3

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - iommus
  - power-domains
  - power-domain-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        video-codec@285100000 {
            compatible = "apple,t6031-ave";
            reg = <0x2 0x85100000 0x0 0x45c000>,
                  <0x2 0x85800000 0x0 0x800000>,
                  <0x2 0x85050000 0x0 0x4000>,
                  <0x2 0x84000000 0x0 0x1000000>;
            reg-names = "core", "iop", "mbox", "axi2af";
            interrupt-parent = <&aic>;
            interrupts = <AIC_IRQ 0 1207 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 0 1201 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 0 1200 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 0 1203 IRQ_TYPE_LEVEL_HIGH>,
                         <AIC_IRQ 0 1202 IRQ_TYPE_LEVEL_HIGH>;
            iommus = <&ave0_dart 0 0x100 0x0 0x1 0x0>,
                     <&ave0_iop_dart 0 0x100 0x0 0x1 0x0>;
            power-domains = <&ps_venc0_sys>, <&ps_venc0_dma>,
                            <&ps_venc0_pipe4>, <&ps_venc0_pipe5>,
                            <&ps_venc0_me0>, <&ps_venc0_me1>;
            power-domain-names = "sys", "dma", "pipe4", "pipe5", "me0", "me1";
        };
    };
