%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/apple,mcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple memory cache controller

maintainers:
  - hitori-chan <hitori1403@gmail.com>

description:
  The memory cache controllers (AMCC) of Apple silicon SoCs. Each AMCC
  holds the system level cache's planes and the DRAM channel controllers
  (DCS) behind it. The bootloader enables the cache; the operating system
  enables the channel controllers' dynamic power gating.

properties:
  compatible:
    items:
      - enum:
          - apple,t6034-mcc
      - const: apple,t6031-mcc

  reg:
    description: One register range per AMCC.
    minItems: 1
    maxItems: 8

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        memory-controller@220000000 {
            compatible = "apple,t6034-mcc", "apple,t6031-mcc";
            reg = <0x2 0x20000000 0x0 0x2000000>,
                  <0x2 0x22000000 0x0 0x2000000>;
        };
    };
