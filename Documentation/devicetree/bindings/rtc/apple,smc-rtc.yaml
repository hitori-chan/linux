%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/apple,smc-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple SMC RTC

description:
  Apple Silicon Macs (M1, etc.) have an RTC that is part of the PMU IC,
  but most of the PMU functionality is abstracted out by the SMC.
  An additional RTC offset stored inside NVMEM is required to compute
  the current date/time.

maintainers:
  - Sven Peter <sven@kernel.org>

properties:
  compatible:
    const: apple,smc-rtc

  nvmem-cells:
    minItems: 1
    items:
      - description: 48bit RTC offset, specified in 32768 (2^15) Hz clock ticks
      - description: the PMU's alarm control register
      - description: the PMU's alarm register, the counter second to match
      - description: the PMU's alarm interrupt mask register
      - description:
          the PMU's alarm event register, where it is not the control
          register

  nvmem-cell-names:
    minItems: 1
    items:
      - const: rtc_offset
      - const: rtc_alarm_ctrl
      - const: rtc_alarm
      - const: rtc_irq_mask
      - const: rtc_alarm_event

  interrupts:
    description: the PMU's interrupt, which signals the alarm
    maxItems: 1

required:
  - compatible
  - nvmem-cells
  - nvmem-cell-names

additionalProperties: false
